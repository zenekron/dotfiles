- name: Install packages
  become: true
  community.general.pacman:
    name:
      # shell
      - direnv
      - fish
      - fisher
      - starship

      # cli
      - 7zip
      - fzf
      - git-delta
      - hyperfine # a command-line benchmarking tool
      - jq
      - openssh
      - tealdeer
      - watchexec # executes commands in response to file modifications
      - wget

      # cli.replacements
      - bat # cat replacement
      - eza # ls replacement
      - fd # find replacement
      - ripgrep # grep replacement
      - sd # sed replacement
      - zellij # tmux replacement
      - procs # ps

      # audio
      - pipewire

      # fonts
      - noto-fonts
      - ttf-jetbrains-mono-nerd

      # graphical
      - firefox
      - udiskie

      # wayland
      - sway
      - waybar
      - wl-clipboard
      - wofi

      # development
      - docker
      - docker-compose
      - neovim
      - typescript-language-server
      - vscode-json-languageserver

      # development/lua
      - lua51 # required by lazy.nvim
      - luarocks # required by lazy.nvim
      - stylua

      # development/shell
      - bash-language-server
      - shellcheck
      - shfmt

    reason: explicit
    reason_for: all
    state: present

- name: Install package dependencies
  become: true
  community.general.pacman:
    name:
      # audio.pipewire
      - pipewire-alsa
      - pipewire-docs
      - pipewire-jack
      - pipewire-pulse

      # development.docker
      - docker-buildx

    reason: dependency
    reason_for: all
    state: present

- name: Enable services
  become: true
  with_items:
    - docker.socket
  builtin.ansible.service:
    name: "{{ item }}"
    state: started
    enabled: true

# vim: ft=yaml.ansible
